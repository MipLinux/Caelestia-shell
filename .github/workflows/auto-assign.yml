name: Auto assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: auto-assign-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign issue or PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.AUTO_ASSIGNEE || 'LaT-SKY' }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$NUMBER" ]; then
            echo "::error::事件里没有 issue / PR 编号"
            exit 1
          fi

          # fork PR 的 GITHUB_TOKEN 是只读的，写 assignee 会 403；不把 CI 弄红。
          if [ "$EVENT" = "pull_request" ] && [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::notice::来自 fork 的 PR，跳过自动分配。"
            exit 0
          fi

          if ! gh api "repos/$GH_REPO/assignees/$ASSIGNEE" >/dev/null 2>&1; then
            echo "::notice::$ASSIGNEE 不是本仓库可分配成员，跳过自动分配。"
            exit 0
          fi

          jq -n --arg a "$ASSIGNEE" '{assignees: [$a]}' \
            | gh api -X POST "repos/$GH_REPO/issues/$NUMBER/assignees" --input - >/dev/null
          echo "已把 #$NUMBER 分配给 $ASSIGNEE"
